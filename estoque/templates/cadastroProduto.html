<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f8f8f8; }
        .card { background: white; padding: 24px 32px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); max-width: 500px; }
        h2 { margin-bottom: 20px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .botoes { display: flex; gap: 10px; }
        button { padding: 9px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #1e7e34; }
        a.voltar { padding: 9px 20px; background: #6c757d; color: white; border-radius: 4px; text-decoration: none; font-size: 14px; }
        a.voltar:hover { background: #545b62; }
    </style>
</head>
<body>
<div class="card">
    <h2>+ Cadastrar Produto</h2>
    <form method="POST" action="/estoque/cadastrar">
        {% csrf_token %}
        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Descrição</label>
        <input type="text" name="descricao">

        <label>Quantidade Inicial</label>
        <input type="number" name="quantidade" value="0" min="0">

        <label>Quantidade Mínima (alerta de estoque baixo)</label>
        <input type="number" name="quantidade_minima" value="0" min="0">

        <label>Preço Unitário (R$)</label>
        <input type="number" name="preco_unitario" value="0.00" step="0.01" min="0">

        <div class="botoes">
            <button type="submit">Salvar</button>
            <a href="/estoque/listar" class="voltar">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
