<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <style>
        :root {
            --bg-primary: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --primary: #ffc107;
            --primary-hover: #d39e00;
            --focus-ring: rgba(255, 193, 7, 0.25);
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; min-height: 100vh; background: var(--bg-primary); display: flex; justify-content: center; align-items: center; padding: 24px; box-sizing: border-box; }
        .card { background: var(--surface); padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 540px; width: 100%; box-sizing: border-box; transform: scale(0.95); opacity: 0; animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        h2 { margin: 0 0 24px 0; color: var(--text-main); font-size: 24px; font-weight: 700; text-align: center; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-muted); font-size: 14px; }
        input, select, textarea { width: 100%; padding: 11px 14px; box-sizing: border-box; margin-bottom: 18px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; color: var(--text-main); outline: none; transition: all 0.2s ease; background: #ffffff; }
        input:focus, select:focus, textarea:focus { border-color: #b38600; box-shadow: 0 0 0 4px var(--focus-ring); transform: translateY(-1px); }
        input:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; border-color: #e5e7eb; }
        .obs { color: #dc3545; font-size: 12px; margin-top: -14px; margin-bottom: 18px; font-weight: 500; padding-left: 2px; }
        .botoes { display: flex; gap: 12px; margin-top: 8px; }
        button { flex: 1; padding: 12px 24px; background: var(--primary); color: #212529; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease; }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3); }
        a.voltar { flex: 1; padding: 12px 24px; background: #6c757d; color: white; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; text-align: center; box-sizing: border-box; transition: all 0.2s ease; }
        a.voltar:hover { background: #545b62; transform: translateY(-1px); }
        @keyframes popIn { to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
<div class="card">
    <h2>✏️ Editar Produto</h2>
    <form method="POST" action="/estoque/editar/{{ produto.id }}">
        {% csrf_token %}
        <label>Nome do Produto</label>
        <input type="text" name="nome" value="{{ produto.nome }}" required>

        <label>Categoria</label>
        <select name="categoria">
            <option value="">Nenhuma Categoria</option>
            {% for cat in categorias %}
                <option value="{{ cat.id }}" {% if produto.categoria.id == cat.id %}selected{% endif %}>{{ cat.nome }}</option>
            {% endfor %}
        </select>

        <label>Descrição</label>
        <textarea name="descricao" rows="2">{{ produto.descricao|default:'' }}</textarea>

        <label>Quantidade em Estoque</label>
        <input type="number" value="{{ produto.quantidade }}" disabled>
        <p class="obs">⚠️ Para alterar a quantidade atual, utilize a opção "Movimentar".</p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div>
                <label>Quantidade Mínima</label>
                <input type="number" name="quantidade_minima" value="{{ produto.quantidade_minima }}" min="0">
            </div>
            <div>
                <label>Preço Unitário (R$)</label>
                <input type="number" name="preco_unitario" step="0.01" value="{{ produto.preco_unitario }}" min="0">
            </div>
        </div>

        <label>Localização no Depósito</label>
        <input type="text" name="localizacao_deposito" value="{{ produto.localizacao_deposito|default:'' }}" placeholder="Ex: Corredor A, Prateleira 4">

        <div class="botoes">
            <button type="submit">Atualizar Dados</button>
            <a href="/estoque/listar" class="voltar">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
