<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Estoque</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 340px; animation: fadeIn 0.5s ease; }
        h2 { text-align: center; margin-bottom: 24px; color: #1f2937; font-size: 24px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #4b5563; font-size: 14px; }
        input { width: 100%; padding: 10px 14px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; transition: all 0.2s; outline: none; }
        input:focus { border-color: #764ba2; box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15); }
        button { width: 100%; padding: 12px; background: #764ba2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #5c3884; }
        .erro { color: #dc3545; background: #fef2f2; border: 1px solid #fca5a5; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 16px; font-size: 14px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="box">
    <h2>🏪 Sistema Estoque</h2>
    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}
    <form method="POST" action="/login">
        {% csrf_token %}
        <label>Usuário</label>
        <input type="text" name="username" required autofocus>
        <label>Senha</label>
        <input type="password" name="password" required>
        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
