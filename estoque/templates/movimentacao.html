<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Movimentar Estoque</title>
    <style>
        :root {
            --bg-primary: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --primary: #17a2b8;
            --primary-hover: #117a8b;
            --focus-ring: rgba(23, 162, 184, 0.25);
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; min-height: 100vh; background: var(--bg-primary); display: flex; justify-content: center; align-items: center; padding: 24px; box-sizing: border-box; }
        .card { background: var(--surface); padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 480px; width: 100%; box-sizing: border-box; transform: scale(0.95); opacity: 0; animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        h2 { margin: 0 0 6px 0; color: var(--text-main); font-size: 24px; font-weight: 700; text-align: center; }
        .info { background: #e9f5ff; border-left: 4px solid #007bff; padding: 14px; border-radius: 8px; margin-bottom: 22px; font-size: 14px; color: #0056b3; line-height: 1.5; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-muted); font-size: 14px; }
        input, select { width: 100%; padding: 11px 14px; box-sizing: border-box; margin-bottom: 18px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; color: var(--text-main); outline: none; transition: all 0.2s ease; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--focus-ring); transform: translateY(-1px); }
        .botoes { display: flex; gap: 12px; margin-top: 8px; }
        button { flex: 1; padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease; }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(23, 162, 184, 0.25); }
        a.voltar { flex: 1; padding: 12px 24px; background: #6c757d; color: white; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; text-align: center; box-sizing: border-box; transition: all 0.2s ease; }
        a.voltar:hover { background: #545b62; transform: translateY(-1px); }
        .erro { color: #dc3545; background: #fde8ea; border: 1px solid #f5c6cb; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; font-weight: 500; text-align: center; animation: shake 0.4s ease; }
        @keyframes popIn { to { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>
<div class="card">
    <h2>🔄 Movimentar Estoque</h2>
    
    <div class="info">
        <strong>Produto:</strong> {{ produto.nome }}<br>
        <strong>Estoque Atual:</strong> {{ produto.quantidade }} unidades
    </div>

    {% if erro %}
        <div class="erro">❌ {{ erro }}</div>
    {% endif %}

    <form method="POST" action="/estoque/movimentar/{{ produto.id }}">
        {% csrf_token %}

        <label>Tipo de Movimentação</label>
        <select name="tipo">
            <option value="ENTRADA">Entrada (Aumenta o estoque)</option>
            <option value="SAIDA">Saída (Diminui o estoque)</option>
            <option value="AJUSTE">Ajuste Inventário (Substitui valor antigo)</option>
        </select>

        <label>Quantidade</label>
        <input type="number" name="quantidade" min="1" value="1" required>

        <label>Observação / Justificação</label>
        <input type="text" name="observacao" placeholder="Ex: NF 1042, Correção de contagem...">

        <div class="botoes">
            <button type="submit">Efetuar Registo</button>
            <a href="/estoque/listar" class="voltar">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
